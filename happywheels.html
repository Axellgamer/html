<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
}

#og-game-holder {
  width: 100%;
  height: 100%;
}

canvas {
  display: block;
}

/* TINKLE LOADER */

#loading {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #414141;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 22px;
  text-align: center;
  color: #f6cb68;
  font-family: 'Orbitron', Arial, sans-serif;
  transition: opacity .7s ease, visibility .7s ease;
}

#loading.fading {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.tinkle-diamond {
  width: 48px;
  height: 48px;
  border: 3px solid #efbd47;
  transform: rotate(45deg);
  box-shadow: 0 0 18px #dca12877;
  animation: diamond-pulse 1.5s ease-in-out infinite;
  margin-bottom: 12px;
}

@keyframes diamond-pulse {
  0%, 100% {
    opacity: .55;
    scale: .9;
  }
  50% {
    opacity: 1;
    scale: 1.1;
  }
}

.tinkle-title {
  font-weight: 900;
  font-size: clamp(27px, 6vw, 53px);
  letter-spacing: .1em;
  background: linear-gradient(
    180deg,
    #fff2af 0%,
    #f6c55d 40%,
    #b97613 100%
  );
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.tinkle-track {
  width: min(365px, 80vw);
  height: 10px;
  border: 1px solid #d6a538;
  background: #252525;
  border-radius: 15px;
  overflow: hidden;
  margin-top: 8px;
}

#loading-progress {
  display: block;
  width: 100%;
  height: 100%;
  appearance: none;
  -webkit-appearance: none;
  border: 0;
  border-radius: 0;
  background: transparent;
}

#loading-progress::-webkit-progress-bar {
  background: transparent;
}

#loading-progress::-webkit-progress-value {
  background: linear-gradient(90deg, #b67a19, #ffdf70);
  box-shadow: 0 0 12px #ffdc6d;
}

#loading-progress::-moz-progress-bar {
  background: linear-gradient(90deg, #b67a19, #ffdf70);
}

#loading-percent {
  font-size: 15px;
  letter-spacing: .15em;
  color: #ffcf65;
}

#status {
  font-family: Arial, sans-serif;
  font-size: 13px;
  color: #dedede;
  max-width: 85vw;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  margin: 0;
}

#loading.error {
  background: #414141;
}

#retry-button {
  display: none;
  border: 1px solid #d6a538;
  border-radius: 4px;
  background: #352a18;
  color: #ffdc6d;
  font: 700 14px Arial, sans-serif;
  padding: 11px 24px;
  cursor: pointer;
}

#loading.error #retry-button {
  display: inline-block;
}

@media (prefers-reduced-motion: reduce) {
  .tinkle-diamond {
    animation: none;
  }
}
</style>
</head>

<body>

<div id="og-game-holder"></div>

<div id="loading">
  <div class="tinkle-diamond"></div>
  <div class="tinkle-title">TINKLE GAMES</div>

  <div class="tinkle-track">
    <progress
      id="loading-progress"
      max="100"
      value="0"
      aria-label="Asset loading progress">
    </progress>
  </div>

  <div id="loading-percent">0%</div>
  <p id="status">Loading game code...</p>
  <button id="retry-button" type="button">RETRY</button>
</div>

<script>
window.HW_SETTINGS = {
  siteURL: "./",
  user_id: 1,
  username: "Player",
  disableUpload: false
};

/*
 * ORIGINAL GAME PROGRESS FUNCTION
 * Kept globally accessible.
 */
function updateLoadingProgress(percent) {
  const value = Math.max(
    0,
    Math.min(100, Number(percent) || 0)
  );

  const bar = document.getElementById('loading-progress');

  if (bar) {
    bar.value = value;

    document.getElementById('loading-percent')
      .textContent = Math.floor(value) + '%';

    if (!document.getElementById('loading').classList.contains('error')) {
      document.getElementById('status')
        .textContent = 'Loading game assets…';
    }
  }
}

/*
 * ORIGINAL GAME EVENTS
 */
window.addEventListener('hw-load-progress', event => {
  updateLoadingProgress(event.detail?.percent);
});

window.addEventListener('hw-ready', () => {
  updateLoadingProgress(100);

  const loader = document.getElementById('loading');

  if (loader) {
    loader.classList.add('fading');

    setTimeout(() => {
      loader.remove();
    }, 750);
  }
});

/*
 * ERROR HANDLING
 */
function showFailure(message) {
  const el = document.getElementById('loading');

  if (el) {
    el.classList.add('error');
    document.getElementById('status').textContent = message;
  }
}

window.addEventListener('error', event => {
  if (event.target?.tagName === 'SCRIPT') {
    showFailure(
      'A game file could not load. Upload the complete dist folder.'
    );
  } else if (event.message) {
    showFailure(event.message);
  }
}, true);

window.addEventListener('unhandledrejection', event => {
  showFailure(
    String(event.reason?.message || event.reason)
  );
});

document.getElementById('retry-button')
  .addEventListener('click', () => location.reload());

if (location.protocol === 'file:') {
  showFailure(
    'Serve this folder over HTTP, or upload its contents to GitHub Pages.'
  );
}
</script>

<!-- ORIGINAL GAME SCRIPTS: UNCHANGED -->

</body>
</html>
