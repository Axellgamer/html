<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net data: blob:; script-src 'self' https://cdn.jsdelivr.net https://tinklehost.github.io 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com https://happy-wheels-api.nawsifsspammail.workers.dev blob: data:; media-src 'self' https://cdn.jsdelivr.net https://raw.githubusercontent.com blob: data:; object-src 'none'">
<base href="https://cdn.jsdelivr.net/gh/nawsif/host@80b52b89d6e2739e79378ef2512cd86e2ef79c7c/HappyWheels/">
<script src="https://tinklehost.github.io/intro.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#414141">
<title>Happy Wheels | Tinkle Games</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#414141}html,body{height:100dvh}#og-game-holder{width:100%;height:100%;overflow:hidden}canvas{display:block}
#tinkle-loader{position:fixed;inset:0;z-index:9999;background:#414141;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;color:#f6cb68;transition:opacity .7s ease,visibility .7s ease;font-family:'Orbitron',Arial,sans-serif}
#tinkle-loader.fading{opacity:0;visibility:hidden;pointer-events:none}
.tinkle-diamond{width:48px;height:48px;border:3px solid #efbd47;transform:rotate(45deg);box-shadow:0 0 18px #dca12877;animation:diamond-pulse 1.5s ease-in-out infinite;margin:0 0 12px}
@keyframes diamond-pulse{0%,100%{opacity:.55;scale:.9}50%{opacity:1;scale:1.1}}
.tinkle-title{font-weight:900;font-size:clamp(27px,6vw,53px);letter-spacing:.1em;background:linear-gradient(180deg,#fff2af 0%,#f6c55d 40%,#b97613 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tinkle-track{width:min(365px,80vw);height:10px;border:1px solid #d6a538;background:#252525;border-radius:15px;overflow:hidden;margin-top:8px}
#tinkle-progress{height:100%;width:0;background:linear-gradient(90deg,#b67a19,#ffdf70);transition:width .17s linear;box-shadow:0 0 12px #ffdc6d}
#tinkle-percent{font-size:15px;letter-spacing:.15em;color:#ffcf65}
#tinkle-status{font-family:Arial,sans-serif;font-size:13px;color:#dedede;max-width:85vw;white-space:pre-wrap;overflow-wrap:anywhere}
#retry-button{display:none;border:1px solid #d6a538;border-radius:4px;background:#352a18;color:#ffdc6d;font:700 14px Arial,sans-serif;padding:11px 24px;cursor:pointer}
</style>
</head>
<body>
<div id="og-game-holder"></div>
<div id="tinkle-loader" role="status" aria-live="polite">
<div class="tinkle-diamond"></div>
<div class="tinkle-track"><div id="tinkle-progress"></div></div>
<div id="tinkle-percent">0%</div>
<div id="tinkle-status">Loading game code...</div>
<button id="retry-button" type="button">RETRY</button>
</div>
<script>
window.HW_SETTINGS={siteURL:"./",user_id:1,username:"Player",disableUpload:false};
(()=>{
const loader=document.getElementById('tinkle-loader'),bar=document.getElementById('tinkle-progress'),percent=document.getElementById('tinkle-percent'),status=document.getElementById('tinkle-status'),retry=document.getElementById('retry-button');
let ready=false,failed=false,lastProgress=0;
function progress(value,message){if(ready)return;lastProgress=Math.max(lastProgress,Math.min(100,Math.max(0,Number(value)||0)));bar.style.width=lastProgress+'%';percent.textContent=Math.floor(lastProgress)+'%';if(message&&!failed)status.textContent=message;}
window.updateLoadingProgress=value=>progress(value,'Loading game assets...');
window.addEventListener('hw-load-progress',event=>progress(event.detail?.percent,'Loading game assets...'));
window.addEventListener('hw-ready',()=>{ready=true;failed=false;retry.style.display='none';bar.style.width='100%';percent.textContent='100%';status.textContent='Ready!';loader.classList.add('fading');setTimeout(()=>loader.remove(),750);});
function showFailure(message){if(ready)return;failed=true;status.textContent=String(message);retry.style.display='inline-block';}
window.addEventListener('error',event=>{if(event.target?.tagName==='SCRIPT')showFailure('A game file could not load. Check that all game files are available.');else if(event.message)showFailure(event.message);},true);
window.addEventListener('unhandledrejection',event=>showFailure(String(event.reason?.message||event.reason)));
retry.addEventListener('click',()=>location.reload());
if(location.protocol==='file:')showFailure('Serve this page over HTTP or host it on GitHub Pages.');
})();
</script>
<script src="./browser-preferences.js"></script>
<script src="./backend-config.js"></script>
<script src="./hwNative-polyfill.js"></script>
<script src="./offline-catalog.js"></script>
<script src="./offline/browse-catalog.js"></script>
<script src="./offline-api.js"></script>
<script src="./audio-loader.js"></script>
<script src="./js/dependencies.js"></script>
<script src="./js/index.js"></script>
</body>
</html>
